services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: products_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-qph/product_db.sql:/scripts/product_db.sql:ro
      - ./backend-qph/docker/db-init.sh:/docker-entrypoint-initdb.d/01-db-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-qph
    environment:
      DB_URL: jdbc:postgresql://db:5432/products_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-80}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend-qph
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
